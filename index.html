<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bgg:radial-gradient(120% 90% at 50% 0%,#151b4f 0%,#080b22 55%,#03040c 100%);--card:rgba(20,25,62,.55);--hole:#121638;--ink:#e9edff;--mut:#98a2d8;--line:rgba(150,160,255,.2);--inp:rgba(255,255,255,.06);--win:#3df5c0;--loss:#ff5c8a;--acc:#8b7cff;--be:#6c749f;--c1:#8b7cff;--c2:#ffc857;--c3:#3df5c0;--c4:#5cc8ff;--c5:#ff5c8a;--star:255,255,255;--nebo:.9;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bgg:linear-gradient(180deg,#e6e9ff,#f6f1ff 60%,#eaf6ff);--card:rgba(255,255,255,.66);--hole:#f3f1ff;--ink:#1a1f45;--mut:#5d6597;--line:rgba(80,70,200,.2);--inp:rgba(255,255,255,.8);--win:#08987a;--loss:#d6336c;--acc:#5b47e0;--be:#98a0c8;--c1:#5b47e0;--c2:#e0960f;--c3:#08987a;--c4:#1a8fd8;--c5:#d6336c;--star:70,60,170;--nebo:.45;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bgg) fixed;color:var(--ink);font:15px/1.5 "Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;opacity:var(--nebo);background:radial-gradient(40% 35% at 20% 25%,rgba(120,80,255,.38),transparent 70%),radial-gradient(35% 30% at 80% 20%,rgba(0,200,255,.24),transparent 70%),radial-gradient(45% 40% at 70% 85%,rgba(255,70,150,.22),transparent 70%);animation:drift 50s ease-in-out infinite alternate}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:18px}
h1{font:800 20px Orbitron,"Space Grotesk",sans-serif;letter-spacing:.04em;margin:0;display:flex;align-items:center}
h2{font-size:15px;font-weight:700;margin:0 0 10px}
.planet{display:inline-block;flex:none;width:22px;height:22px;border-radius:50%;margin-right:16px;position:relative;background:radial-gradient(circle at 30% 30%,#d6d0ff,#6a55e8 55%,#251a6e);box-shadow:0 0 20px rgba(139,124,255,.7)}
.planet::after{content:"";position:absolute;left:-9px;right:-9px;top:50%;height:9px;margin-top:-4.5px;border:2px solid rgba(255,200,87,.85);border-radius:50%;transform:rotate(-22deg);animation:ring 6s ease-in-out infinite}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
body{--sw:248px}body.sc{--sw:76px}
#side{position:fixed;z-index:30;top:0;left:0;bottom:0;width:var(--sw);display:flex;flex-direction:column;gap:6px;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);overflow:hidden;transition:width .25s cubic-bezier(.2,.8,.2,1),transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.main{position:relative;z-index:1;margin-left:var(--sw);transition:margin-left .25s cubic-bezier(.2,.8,.2,1)}
.sh{display:flex;align-items:center;gap:4px;min-height:44px;margin-bottom:6px;flex:none}
.ib{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--mut);border-radius:12px;cursor:pointer;transition:color .2s,background .2s}
.ib:hover{background:var(--inp);color:var(--ink)}
.ib svg{width:22px;height:22px}
.sh .ib{width:52px}
.brand{display:flex;align-items:center;min-width:0;margin:0;font:800 14px/1.2 Orbitron,"Space Grotesk",sans-serif;letter-spacing:.04em}
.brand .planet{margin-right:14px}
#side nav{display:flex;flex-direction:column;gap:4px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.sb{display:flex;align-items:center;gap:14px;width:100%;height:44px;flex:none;padding:0 0 0 15px;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;border-radius:12px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;transition:color .2s,background .2s}
.sb .ic{flex:none;width:22px;height:22px;display:grid;place-items:center;font-size:16px;line-height:1}
.sb svg{width:22px;height:22px}
.sb:hover{color:var(--ink);background:var(--inp)}
.sb.on{background:linear-gradient(135deg,#6d5cff,#35b6ff);color:#fff;box-shadow:0 0 18px rgba(80,120,255,.55)}
.sb .ic.cd{font-size:10px;font-weight:800;letter-spacing:.02em;border:1.5px solid currentColor;border-radius:6px}
.sb .ic.av{border-radius:50%;background:linear-gradient(135deg,#6d5cff,#35b6ff);color:#fff;font:700 11px Orbitron,"Space Grotesk",sans-serif}
.sf{display:flex;flex-direction:column;gap:4px;flex:none;padding-top:10px;border-top:1px solid var(--line)}
#ac{width:100%;height:44px;margin:0;border-radius:12px}
#acb{display:none}
body.sc #acb{display:flex}body.sc #ac{display:none}
body.sc #side .brand,body.sc .sb .lb{display:none}
body.nt #side,body.nt .main{transition:none!important}
.topbar,.scrim{display:none}
@media (max-width:760px){
#side{width:272px;transform:translateX(-104%)}
body.so #side{transform:none;box-shadow:0 0 60px rgba(0,0,10,.55)}
.main{margin-left:0}
.topbar{display:flex;align-items:center;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:6px 10px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body.so .scrim{display:block;position:fixed;inset:0;z-index:29;background:rgba(0,0,10,.55)}
}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 40px rgba(0,0,10,.25)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.kpis .card{animation:rise .7s both}
.kpis .card:nth-child(2){animation-delay:.07s}.kpis .card:nth-child(3){animation-delay:.14s}.kpis .card:nth-child(4){animation-delay:.21s}.kpis .card:nth-child(5){animation-delay:.28s}.kpis .card:nth-child(6){animation-delay:.35s}
.kpi b{display:block;font:800 22px Orbitron,"Space Grotesk",sans-serif;margin-top:4px}
.kpi b.win,.kpi b.loss{text-shadow:0 0 16px currentColor}
.kpi span{color:var(--mut);font-size:13px}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px}
.win{color:var(--win)}.loss{color:var(--loss)}
svg{width:100%;height:auto;display:block}
.t{fill:var(--mut);font-size:10px}.v{fill:var(--ink);font-size:10px;font-weight:600}
.grow{animation:grow .8s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 0 5px rgba(139,124,255,.5))}
.draw{stroke-dasharray:1;animation:draw 1.8s ease-out both;filter:drop-shadow(0 0 6px var(--acc))}
.fade{animation:fade 1.8s both}
.pie svg{animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;box-shadow:0 0 8px currentColor}
.pie{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.pie svg{width:150px;flex:none}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
label{font-size:13px;color:var(--mut);display:block}
.rk{display:flex;gap:6px}.rk input{min-width:0;flex:1}.rk select{width:62px;flex:none;padding-left:8px;padding-right:4px}
#f input,#f select{height:40px;box-sizing:border-box}#f .btn{height:40px;padding-top:0;padding-bottom:0}
input[readonly]{cursor:default;font-weight:700;color:var(--acc)}
input,select{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--inp);color:var(--ink);margin-top:3px}
option{background:var(--hole);color:var(--ink)}
.btn{font:inherit;font-weight:700;border:0;background:linear-gradient(135deg,#6d5cff,#35b6ff);color:#fff;padding:9px 18px;border-radius:999px;cursor:pointer;box-shadow:0 0 16px rgba(80,120,255,.4);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}.x:hover{color:var(--loss)}
.tw{overflow-x:auto;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
th{text-align:left;color:var(--mut);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--inp)}
.empty{color:var(--mut);text-align:center;padding:28px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.view{display:none}.view.on{display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools .btn{padding:7px 14px}
.eqw{position:relative}.eqw svg{cursor:crosshair;touch-action:pan-y}
.tip{position:absolute;top:4px;transform:translateX(-50%);display:none;pointer-events:none;z-index:2;min-width:190px;padding:9px 11px;font-size:12px;line-height:1.5;background:var(--hole);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,10,.45)}
.tip hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.cal div{min-height:54px;border-radius:8px;padding:4px 6px;font-size:11px;color:var(--mut)}.cal b{display:block;font-size:12px;color:var(--ink)}
@keyframes drift{from{transform:translate(-3%,-2%) rotate(0)}to{transform:translate(4%,3%) rotate(8deg)}}
@keyframes ring{50%{transform:rotate(-22deg) scale(1.1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-40deg)}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important}#side,.main{transition:none!important}}
</style>
</head>
<body class="nt">
<div class="scrim" id="scrim"></div>
<aside id="side">
<div class="sh"><button class="ib" id="tg" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M9.5 4v16"/></svg></button><h1 class="brand"><i class="planet"></i><span class="bn">Nhật ký giao dịch</span></h1></div>
<nav id="nav" aria-label="Menu"></nav>
<div class="sf">
<div class="acw"><button class="sb" id="acb" type="button"></button><select id="ac" aria-label="Account"></select></div>
<button class="sb" id="th" type="button"></button>
<button class="sb" id="lg" type="button"></button>
</div>
</aside>
<div class="main">
<div class="topbar"><button class="ib" id="tg2" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M9.5 4v16"/></svg></button><span class="brand"><i class="planet"></i><span class="bn">Nhật ký giao dịch</span></span></div>
<div class="wrap">

<section class="view" id="v-dash"></section>

<section class="view" id="v-log">
<div class="card">
<h2>Thêm lệnh</h2>
<form id="f">
<label>Tài khoản<select id="fac"></select></label>
<label>Ngày<input type="date" id="fd" required></label>
<label>Mã<input id="fs" list="syms" placeholder="NQ, EURUSD..." required></label>
<datalist id="syms"><option>EURUSD<option>GBPUSD<option>USDJPY<option>AUDUSD<option>XAUUSD<option>GC<option>SI<option>NQ<option>ES<option>YM</datalist>
<label>Hướng<select id="fi"><option value="Long">Long</option><option value="Short">Short</option></select></label>
<label>Setup<select id="fp"></select></label>
<label>Lãi/lỗ trước phí ($)<input type="number" step="any" id="fl" required></label>
<label>Risk<span class="rk"><input type="number" step="any" min="0.01" id="fr" placeholder="100"><select id="frm"><option value="usd">$</option><option value="pct">%</option></select></span></label>
<label>RR (tự tính)<input id="frr" readonly tabindex="-1" placeholder="–"></label>
<label>Giá vào<input type="number" step="any" id="fen"></label>
<label>Giá ra<input type="number" step="any" id="fex"></label>
<label>Stop loss<input type="number" step="any" id="fsl"></label>
<label>Phí ($)<input type="number" step="any" id="ffe"></label>
<label>Giờ vào lệnh<input type="time" id="fti"></label>
<label>Cảm xúc<select id="fem"></select></label>
<label>Lỗi mắc phải<select id="fmi"></select></label>
<label>Ghi chú<input id="fn"></label>
<button class="btn" type="button" id="fsb">Lưu lệnh</button><button class="btn ghost" type="button" id="cx" style="display:none">Huỷ sửa</button>
</form>
</div>
<div class="card tw" id="tbl"></div>
</section>

<section class="view" id="v-an"></section>

<section class="view" id="v-set">
<div class="card">
<h2>Setup giao dịch</h2>
<div class="row"><label style="flex:1;min-width:180px">Tên setup mới<input id="ns" placeholder="VD: Opening range"></label><button class="btn" id="adds">Thêm setup</button></div>
<div class="tw" id="setl"></div>
</div>
<div class="card" style="margin-top:12px">
<h2>Tài khoản</h2>
<div class="row"><label style="flex:1;min-width:160px">Tên tài khoản<input id="nan" placeholder="VD: Prop firm 50K"></label><label>Loại<select id="nat"><option value="Live">Live</option><option value="Demo">Demo</option><option value="Prop">Prop firm</option></select></label><label>Vốn ban đầu ($)<input type="number" id="nab" value="10000"></label><button class="btn" id="adda">Thêm tài khoản</button></div>
<div class="tw" id="acl"></div>
<p class="row" style="margin-top:16px"><button class="btn ghost" id="demo">Nạp dữ liệu mẫu</button><button class="btn ghost" id="clr">Xoá toàn bộ lệnh</button></p>
</div>
<div class="card" style="margin-top:12px">
<h2>Sao lưu dữ liệu</h2>
<div class="row"><label>Phạm vi<select id="xa"></select></label><button class="btn ghost" id="xj">Xuất JSON</button><button class="btn ghost" id="xc">Xuất CSV</button><button class="btn ghost" id="xi">Nhập file</button><input type="file" id="imp" accept=".json,.csv" hidden></div>
</div>
</section>
</div>
</div>

<script>
const $=s=>document.querySelector(s);
let S={trades:[],setups:['Breakout','Pullback','Reversal','Range'],balance:10000};
try{const r=localStorage.getItem('tj1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!Array.isArray(S.accounts))S.accounts=[];if(!Array.isArray(S.trades))S.trades=[];if(!Array.isArray(S.setups))S.setups=[];
S.accounts=S.accounts.filter(a=>a&&a.id!=null).map(a=>({...a,id:String(a.id),name:String(a.name||a.id),balance:+a.balance||0,type:a.type||'Live',dl:+a.dl>0?+a.dl:null,md:+a.md>0?+a.md:null}));
if(!S.accounts.length)S.accounts=[{id:'a1',name:'Tài khoản 1',balance:+S.balance||0,type:'Live',dl:null,md:null}];
S.trades.forEach(t=>{if(!S.accounts.some(a=>a.id===t.acc))t.acc=S.accounts[0].id});
if(S.cur!=='all'&&!S.accounts.some(a=>a.id===S.cur))S.cur=S.accounts[0].id;
const save=()=>{try{localStorage.setItem('tj1',JSON.stringify(S))}catch(e){}};
const TR=()=>S.cur==='all'?S.trades:S.trades.filter(t=>t.acc===S.cur);
const BAL=()=>S.cur==='all'?S.accounts.reduce((a,x)=>a+x.balance,0):(S.accounts.find(x=>x.id===S.cur)||{balance:0}).balance;
const A0=()=>S.cur==='all'?S.accounts[0].id:S.cur;
const uid=()=>{let i;do{i='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}while(S.accounts.some(a=>a.id===i));return i};
const dupName=(n,id)=>S.accounts.some(a=>a.id!==id&&a.name.trim().toLowerCase()===n.trim().toLowerCase());
let P={lang:'vi',theme:''};
try{Object.assign(P,JSON.parse(localStorage.getItem('tj_p')||'{}'))}catch(e){}
if(!P.theme)P.theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
const savP=()=>{try{localStorage.setItem('tj_p',JSON.stringify(P))}catch(e){}};
const EN={'Nhật ký giao dịch':'Trading Journal','Nhật ký lệnh':'Trade Log','Thêm lệnh':'Add trade','Ngày':'Date','Mã':'Symbol','Hướng':'Side','Lãi/lỗ ($)':'P/L ($)','R (tuỳ chọn)':'R (optional)','Ghi chú':'Notes','Lưu lệnh':'Save trade','Setup giao dịch':'Trading setups','Tên setup mới':'New setup name','Thêm setup':'Add setup','Tài khoản':'Account','Vốn ban đầu ($)':'Starting balance ($)','Lưu':'Save','Nạp dữ liệu mẫu':'Load sample data','Xoá toàn bộ lệnh':'Delete all trades','Xoá toàn bộ lệnh?':'Delete all trades?','VD: Opening range':'e.g. Opening range',
'Chưa có dữ liệu':'No data yet','Cần ít nhất 2 lệnh để vẽ đường vốn':'Add at least 2 trades to draw the equity curve','Lệnh':'Trade',
'Chưa có lệnh nào. Vào tab "Nhật ký lệnh" để thêm lệnh đầu tiên, hoặc nạp dữ liệu mẫu ở tab "Setup".':'No trades yet. Open the "Trade Log" tab to add your first trade, or load sample data in the "Setup" tab.',
'Lãi/lỗ ròng':'Net P/L','Tỷ lệ thắng':'Win rate','R trung bình':'Avg R','Số lệnh':'Trades','Vốn hiện tại':'Balance',
'Đường vốn':'Equity curve','Lãi/lỗ theo mã':'P/L by symbol','Thắng / thua':'Wins / losses','Lãi/lỗ theo setup':'P/L by setup','Số lệnh theo thị trường':'Trades by market',

  o+=`<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(Math.abs(y1-y0),1)}" rx="3" class="grow" style="transform-origin:center ${v>=0?'bottom':'top'};transform-box:fill-box;animation-delay:${i*70}ms" fill="var(${v>=0?'--win':'--loss'})"/>`;

  if(f>=0.9999){p+=`<circle cx="${c}" cy="${c}" r="${r}" fill="${it.c}"/>`;return}
  const b=a+f*2*Math.PI,x1=c+r*Math.cos(a),y1=c+r*Math.sin(a),x2=c+r*Math.cos(b),y2=c+r*Math.sin(b);
  p+=`<path d="M${c} ${c}L${x1} ${y1}A${r} ${r} 0 ${f>0.5?1:0} 1 ${x2} ${y2}Z" fill="${it.c}"/>`;a=b});

 st=Array.from({length:Math.round(W*H/4500)},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.9+.1,p:Math.random()*6.28,s:Math.random()*.004+.001}))}
let f=0;
function frame(t){
 if(f++%30===0)col=getComputedStyle(document.documentElement).getPropertyValue('--star').trim()||'255,255,255';
 x.clearRect(0,0,W,H);
 st.forEach(s=>{const a=.3+.7*Math.abs(Math.sin(s.p+t*s.s));
  const px=s.x+mx*s.z*24,py=(s.y+(rm?0:t*.006*s.z))%H;
  x.fillStyle=`rgba(${col},${a*s.z})`;x.beginPath();x.arc(px,py,s.z*1.4+.2,0,6.283);x.fill()});
 if(!rm&&Math.random()<.004&&sh.length<2)sh.push({x:Math.random()*W,y:Math.random()*H*.5,vx:7+Math.random()*4,vy:3+Math.random()*2,l:1});
 sh=sh.filter(q=>{q.x+=q.vx;q.y+=q.vy;q.l-=.02;if(q.l<=0)return false;
  const g=x.createLinearGradient(q.x,q.y,q.x-q.vx*9,q.y-q.vy*9);g.addColorStop(0,`rgba(${col},${q.l})`);g.addColorStop(1,`rgba(${col},0)`);
  x.strokeStyle=g;x.lineWidth=1.6;x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x-q.vx*9,q.y-q.vy*9);x.stroke();return true});
 if(!rm)requestAnimationFrame(frame)}
size();addEventListener('resize',size);
addEventListener('mousemove',e=>{mx=e.clientX/W-.5});
requestAnimationFrame(frame);
})();
refresh();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.remove('nt')));
</script>
</body>
</html>
